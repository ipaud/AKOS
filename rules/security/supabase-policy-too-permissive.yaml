recommendation: Scope the policy to the requester — USING (auth.uid() = user_id) or an equivalent ownership check. If this genuinely is a public lookup table, mark it with a "-- akos:allow SUPABASE_POLICY_TOO_PERMISSIVE" comment stating why.
