id: SUPABASE_POLICY_TOO_PERMISSIVE
title: RLS policy with an always-true USING or WITH CHECK clause
domain: security
level: A
severity:
  default: HIGH
  profiles:
    Production: CRITICAL
    Enterprise: CRITICAL
confidence: High
related_packs:
  - backend/supabase
  - security/owasp-top-10
detector: rules/security/supabase-policy-too-permissive.py
applies_to:
  glob: ["**/*.sql"]
  target: project-source
suppressible: false
recommendation: Scope the policy to the requester — USING (auth.uid() = user_id) or an equivalent ownership check. If public access is intentional, replace the always-true policy with an explicitly reviewed, least-privilege access design; an akos:allow comment cannot bypass this security-floor rule.
references:
  - packs/backend/supabase/engineering-rules.md
version: 1
status: stable
