id: SUPABASE_POLICY_TOO_PERMISSIVE
title: RLS policy with an always-true USING or WITH CHECK clause
domain: security
level: A
severity:
  default: HIGH
  profiles:
    Production: CRITICAL
    Enterprise: CRITICAL
confidence: High
related_packs:
