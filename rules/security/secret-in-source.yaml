# The default severity is HIGH, but the detector marks realistic credentials
# (live vendor keys, service_role JWTs, high-entropy generic secrets) as
# per-finding `blocking: true`, so they gate the exit code even below CRITICAL
# and regardless of which directory they sit in — a real key under tests/ is
# still a real key. A Stripe *test* key is the one downgrade (MEDIUM,
# non-blocking); it is not a live credential.
id: SECRET_IN_SOURCE
title: Likely secret literal committed to source
domain: security
level: A
severity:
  default: HIGH
confidence: High
related_packs:
  - security/owasp-top-10
  - backend/supabase
detector: rules/security/secret-in-source.py
applies_to:
  glob:
    - "**/.env"
    - "**/.env.*"
    - "**/*.env"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.mjs"
    - "**/*.cjs"
    - "**/*.vue"
    - "**/*.svelte"
    - "**/*.py"
    - "**/*.go"
    - "**/*.java"
    - "**/*.rb"
    - "**/*.php"
    - "**/*.rs"
    - "**/*.kt"
    - "**/*.kts"
    - "**/*.swift"
    - "**/*.cs"
    - "**/*.fs"
    - "**/*.fsx"
    - "**/*.scala"
    - "**/*.groovy"
    - "**/*.gradle"
    - "**/*.dart"
    - "**/*.ex"
    - "**/*.exs"
    - "**/*.erl"
    - "**/*.hrl"
    - "**/*.lua"
    - "**/*.pl"
    - "**/*.pm"
    - "**/*.r"
    - "**/*.R"
    - "**/*.c"
    - "**/*.h"
    - "**/*.cc"
    - "**/*.cpp"
    - "**/*.hpp"
    - "**/*.sh"
    - "**/*.bash"
    - "**/*.zsh"
    - "**/*.fish"
    - "**/*.ps1"
    - "**/*.sql"
    - "**/*.json"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.toml"
    - "**/*.ini"
    - "**/*.conf"
    - "**/*.properties"
    - "**/*.tf"
    - "**/*.tfvars"
    - "**/*.xml"
    - "**/Dockerfile"
    - "**/Dockerfile.*"
    - "**/Makefile"
    - "**/id_*"
    - "**/*.pem"
    - "**/*.key"
  target: project-source
suppressible: false
recommendation: Move the value to an environment variable or secret manager; never commit a real key. Rotate it if it has already been pushed.
references:
  - packs/security/owasp-top-10/engineering-rules.md
version: 1
status: stable
