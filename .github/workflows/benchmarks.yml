name: Benchmarks (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: chmod scripts
        run: chmod +x bin/akos

      - name: Run full benchmark suite and generate the report
        run: |
          mkdir -p benchmarks
          python3 benchmarks/runners/run.py run --format json > benchmarks/report.json
          python3 benchmarks/runners/run.py run > benchmarks/report.md || true
          # report.md/json are gitignored on purpose (regenerate, don't commit) —
          # uploaded as a workflow artifact instead, for anyone who wants the
          # point-in-time result without reproducing it locally.

      - name: Fail the build if any case regressed
        run: python3 benchmarks/runners/run.py run

      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: benchmark-report
          path: |
            benchmarks/report.md
            benchmarks/report.json
          retention-days: 30
