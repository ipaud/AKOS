name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Bash syntax check
        run: |
          set -e
          for f in bin/akos install.sh update.sh doctor.sh uninstall.sh merge-pr.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: shellcheck (gating)
        # ubuntu-latest ships shellcheck. For a project whose highest-risk code
        # is bash, the one tool that catches unquoted expansions must be able to
        # fail the build — no `|| true`, no silent skip.
        # SC2088 excluded: the scripts print `~/...` in human-readable status
        # messages by design; every REAL path uses $HOME. Excluding it here
        # keeps intent in one visible place rather than scattering per-line
        # disables through the display strings.
        run: |
          shellcheck --version
          shellcheck -x -S warning -e SC2088 bin/akos install.sh update.sh doctor.sh uninstall.sh merge-pr.sh

      - name: No tracked Python bytecode
        # .gitignore does not untrack already-tracked files; a committed .pyc
        # regenerates locally and breaks `git pull --ff-only` in update.sh.
        run: |
          if git ls-files | grep -E '\.pyc$|__pycache__/'; then
            echo "tracked bytecode above — run: git rm -r --cached the paths, then commit"
            exit 1
          fi

      - name: Python syntax check
        run: |
          set -e
          python3 -m py_compile schemas/*.py rules/*/*.py benchmarks/runners/*.py benchmarks/providers/*.py

      - name: chmod scripts
        run: chmod +x install.sh update.sh doctor.sh uninstall.sh bin/akos

      - name: doctor.sh
        run: ./doctor.sh

      - name: akos validate (packs/agents/workflows)
        run: python3 schemas/validate.py all

      - name: akos rules registry sanity (list only — no target project to scan in CI)
        run: |
          bin/akos rules list
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'rules')
          from runner import discover_rules
          # No errors collector — a malformed registry raises RegistryError and
          # fails this step loudly, rather than silently discovering fewer rules.
          rules = discover_rules()
          print(f'{len(rules)} rules discovered')
          assert len(rules) >= 8, f'expected at least 8 rules, found {len(rules)}'
          PY

      - name: akos rules self-scan completes (fail-closed — no operational errors)
        run: |
          bin/akos rules run . --format json > /tmp/akos-self-scan.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/akos-self-scan.json'))
          # The invariant is that the scan RAN COMPLETELY: every registry parsed
          # and every detector loaded and executed. Findings on AKOS's own
          # deliberately-vulnerable corpus are expected; a broken detector or
          # registry is not.
          assert d['status'] != 'error', d
          assert not d['errors'], d['errors']
          print('self-scan complete:', d['summary'])
          PY

      - name: akos freshness (fail only on expired)
        run: python3 schemas/freshness.py --fail-on expired

      - name: akos benchmark (full suite — all cases are fast/synthetic)
        run: python3 benchmarks/runners/run.py run

      - name: Unit tests
        run: python3 -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Integration tests
        run: |
          for t in tests/integration/test_*.sh; do
            echo "=== $t ==="
            bash "$t"
          done
