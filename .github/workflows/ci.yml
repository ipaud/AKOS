name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install development-only test tooling
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Bash syntax check
        run: |
          set -e
          for f in bin/akos bin/akos-common.sh install.sh update.sh doctor.sh uninstall.sh merge-pr.sh tests/integration/test_*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: shellcheck (gating)
        run: |
          shellcheck --version
          shellcheck -x -S warning bin/akos $(git ls-files '*.sh')

      - name: No tracked Python bytecode
        run: |
          if git ls-files | grep -E '\.pyc$|__pycache__/'; then
            echo "tracked bytecode above — remove it from the index before merging"
            exit 1
          fi

      - name: Python syntax check
        run: |
          set -e
          python3 -m py_compile schemas/*.py bin/*.py rules/*.py rules/*/*.py benchmarks/runners/*.py benchmarks/providers/*.py tests/ci/*.py

      - name: chmod scripts
        run: chmod +x install.sh update.sh doctor.sh uninstall.sh bin/akos

      - name: doctor.sh
        run: ./doctor.sh

      - name: akos validate (packs/agents/workflows, schema_version 1, strict)
        run: |
          python3 schemas/validate.py all
          python3 schemas/validate.py all --strict

      - name: akos routing-check (draft packs excluded from stable routing)
        run: python3 schemas/routing_check.py

      - name: akos rules registry sanity
        run: |
          bin/akos rules list
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'rules')
          from runner import discover_rules
          rules = discover_rules()
          print(f'{len(rules)} rules discovered')
          assert len(rules) >= 8, f'expected at least 8 rules, found {len(rules)}'
          PY

      - name: akos rules self-scan completes
        # Exit 0 (clean) and 2 (blocking fixture finding) are complete scans.
        # The helper rejects exit 1, malformed JSON, errors, rc/status drift,
        # and any blocker outside exact reviewed rule-id + fixture-case pairs.
        run: python3 tests/ci/self_scan_gate.py --akos-bin bin/akos --target .

      - name: akos freshness (fail only on expired)
        run: python3 schemas/freshness.py --fail-on expired

      - name: Unit, benchmark, and integration tests with branch coverage
        run: |
          mkdir -p .cache
          coverage erase
          coverage run -m unittest discover -s tests/unit -p 'test_*.py' -v
          coverage run benchmarks/runners/run.py run
          python3 tests/ci/run_integrations.py --coverage
          coverage report

  functional:
    name: Functional (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu / Python 3.10 floor
            os: ubuntu-latest
            python-version: "3.10"
          - label: macOS / current Python
            os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: chmod scripts
        run: chmod +x install.sh update.sh doctor.sh uninstall.sh bin/akos

      - name: Unit tests
        run: python3 -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Integration tests
        run: |
          for t in tests/integration/test_*.sh; do
            echo "=== $t ==="
            bash "$t"
          done
