version: 2
updates:
  # Actions are SHA-pinned; Dependabot is the controlled path for pin updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # AKOS has no runtime Python package dependency. requirements-dev.txt pins
  # coverage.py for CI and local measurement only.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
